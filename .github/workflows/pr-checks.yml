name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better diff analysis
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v40
      with:
        files: |
          app/**/*.py
          config/**/*.py
          run.py
          requirements.txt
          *.py
    
    - name: Lint only changed Python files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"
        
        # Run pylint on changed Python files
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == *.py ]]; then
            echo "Linting $file..."
            pylint "$file" --exit-zero --reports=no --score=no
          fi
        done
    
    - name: Check code formatting on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # Check formatting of changed Python files
        changed_py_files=""
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == *.py ]]; then
            changed_py_files="$changed_py_files $file"
          fi
        done
        
        if [ -n "$changed_py_files" ]; then
          echo "Checking formatting for: $changed_py_files"
          black --check --diff $changed_py_files
        fi
    
    - name: Validate PR requirements
      run: |
        echo "Validating pull request requirements..."
        
        # Check if PR title follows conventional commit format (optional)
        pr_title="${{ github.event.pull_request.title }}"
        echo "PR Title: $pr_title"
        
        # Check if PR has description
        pr_body="${{ github.event.pull_request.body }}"
        if [ -z "$pr_body" ]; then
          echo "⚠️  Warning: PR has no description"
        else
          echo "✅ PR has description"
        fi
        
        echo "✅ PR validation completed!"

  architecture-compliance:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check modular architecture compliance
      run: |
        echo "Checking architecture compliance..."
        
        # Check that business logic is not in route files
        if grep -r "class.*:" app/routes/ | grep -v "Routes"; then
          echo "❌ Found non-route classes in routes/ directory"
          exit 1
        fi
        
        # Check that route handlers don't have direct file I/O
        if grep -r "open(" app/routes/ | grep -v "#"; then
          echo "❌ Found direct file I/O in routes/ - should use services"
          exit 1
        fi
        
        # Check that models don't import Flask
        if grep -r "from flask" app/models/ | grep -v "#"; then
          echo "❌ Found Flask imports in models/ - models should be framework-agnostic"
          exit 1
        fi
        
        # Check for proper imports structure
        echo "✅ Architecture compliance check passed!"

  documentation-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check documentation updates
      run: |
        echo "Checking documentation..."
        
        # Check if significant changes require documentation updates
        if git diff --name-only HEAD~1 | grep -E "(app/|config/)" | grep -q "\.py$"; then
          echo "Python code changes detected"
          
          # Check if API endpoints changed
          if git diff HEAD~1 | grep -E "add_url_rule|route\(" | grep -q "^+"; then
            echo "⚠️  API changes detected - consider updating API documentation in README.md"
          fi
          
          # Check if new services added
          if git diff --name-only HEAD~1 | grep -q "app/services/.*\.py$"; then
            echo "⚠️  Service changes detected - consider updating ARCHITECTURE.md"
          fi
        fi
        
        echo "✅ Documentation check completed!"
