name: Code Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: Check code formatting with Black
      run: |
        black --check --diff app/ config/ run.py
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app/ config/ run.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 app/ config/ run.py --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics --extend-ignore=E203,W503
    
    - name: Lint with pylint
      run: |
        pylint app/ config/ run.py --exit-zero --reports=no --score=no
    
    - name: Type check with mypy
      run: |
        mypy app/ config/ run.py --ignore-missing-imports --no-error-summary
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff app/ config/ run.py
      continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run security check with bandit
      run: |
        bandit -r app/ config/ run.py -f json -o bandit-report.json || true
        bandit -r app/ config/ run.py
      continue-on-error: true
    
    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
      continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: Test application startup
      run: |
        # Test that the application can start without errors
        timeout 10s python run.py || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi
        echo "Application startup test passed"
    
    - name: Run pytest (when tests are implemented)
      run: |
        # Placeholder for future tests
        echo "Test framework ready - implement tests in tests/ directory"
        # pytest tests/ --cov=app --cov-report=xml
      continue-on-error: true

  validate-structure:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate project structure
      run: |
        echo "Validating modular architecture structure..."
        
        # Check for required directories
        [ -d "app" ] || { echo "Missing app/ directory"; exit 1; }
        [ -d "app/models" ] || { echo "Missing app/models/ directory"; exit 1; }
        [ -d "app/services" ] || { echo "Missing app/services/ directory"; exit 1; }
        [ -d "app/routes" ] || { echo "Missing app/routes/ directory"; exit 1; }
        [ -d "app/utils" ] || { echo "Missing app/utils/ directory"; exit 1; }
        [ -d "config" ] || { echo "Missing config/ directory"; exit 1; }
        [ -d "templates" ] || { echo "Missing templates/ directory"; exit 1; }
        [ -d "static" ] || { echo "Missing static/ directory"; exit 1; }
        
        # Check for required files
        [ -f "run.py" ] || { echo "Missing run.py"; exit 1; }
        [ -f "requirements.txt" ] || { echo "Missing requirements.txt"; exit 1; }
        [ -f "README.md" ] || { echo "Missing README.md"; exit 1; }
        [ -f "ARCHITECTURE.md" ] || { echo "Missing ARCHITECTURE.md"; exit 1; }
        [ -f "CONTRIBUTING.md" ] || { echo "Missing CONTRIBUTING.md"; exit 1; }
        [ -f ".env.example" ] || { echo "Missing .env.example"; exit 1; }
        
        echo "✅ Project structure validation passed!"

  deployment-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test production-like environment
      run: |
        export FLASK_ENV=production
        export DEBUG=False
        echo "Testing production configuration..."
        timeout 10s python run.py || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi
        echo "✅ Production environment test passed!"
