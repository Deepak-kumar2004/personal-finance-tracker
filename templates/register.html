<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Manager - Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-page">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-wallet"></i>
                <span>Money Manager</span>
            </div>
            <div class="nav-controls">
                <a href="/" class="btn btn-outline">
                    <i class="fas fa-home"></i>
                    Home
                </a>
                <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-form-card">
                <div class="auth-header">
                    <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                    <p>Join thousands of users managing their finances effectively.</p>
                </div>

                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i>
                            Username
                        </label>
                        <input type="text" id="username" name="username" required 
                               placeholder="Choose a username" autocomplete="username"
                               minlength="3">
                        <small class="form-help">At least 3 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <input type="email" id="email" name="email" required 
                               placeholder="Enter your email" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <input type="password" id="password" name="password" required 
                               placeholder="Create a password" autocomplete="new-password"
                               minlength="6">
                        <small class="form-help">At least 6 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">
                            <i class="fas fa-lock"></i>
                            Confirm Password
                        </label>
                        <input type="password" id="confirm-password" name="confirm-password" required 
                               placeholder="Confirm your password" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? 
                        <a href="/login" class="auth-link">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
    </div>

    <!-- Success Message -->
    <div id="success-message" class="message success hidden">
        <i class="fas fa-check-circle"></i>
        <span id="success-text"></span>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="message error hidden">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text"></span>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
